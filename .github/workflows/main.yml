name: Build Low Latency Audio

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout low-latency-audio
        uses: actions/checkout@v4

      # Добавляем окружение VS 2022 и WDK в PATH раннера
      - name: Set up MSVC Dev Cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Вытягиваем ASIO SDK
      - name: Checkout ASIO SDK
        uses: actions/checkout@v4
        with:
          repository: 'audiosdk/asio'
          path: 'asio-sdk-temp'

      # Раскладываем ASIO по местам
      - name: Setup ASIO SDK files
        shell: pwsh
        run: |
          $targetDir = "src/uac2-asio/asio"
          if (!(Test-Path $targetDir)) {
              New-Item -ItemType Directory -Force -Path $targetDir
          }
          Copy-Item -Path "asio-sdk-temp/common/*" -Destination $targetDir -Recurse -Force
          Write-Host "ASIO files copied successfully."

      # Собираем x64 Release
      - name: Build Driver and ASIO
        shell: pwsh
        run: |
          .\build\build.ps1 -Configuration Release -Platform x64

      # Сохраняем результат
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LowLatencyAudio-x64-Release
          path: |
            build/staging/
            artifacts/
            **/Release/**/*.sys
            **/Release/**/*.inf
            **/Release/**/*.cat
            **/Release/**/*.dll
            **/Release/**/*.msi
          if-no-files-found: warn
